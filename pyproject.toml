[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "tiktoken>=0.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "markdownify>=0.11",
    "mempalace>=3.3",
    "agentlightning>=0.1",
    "poml>=0.0.8",
]

[project.scripts]
kent = "agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.hatch.build.targets.wheel.force-include]
"agent/py.typed" = "agent/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live-network tests (deselect with -m 'not integration')",
    "memory: tests requiring real MemPalace store (deselect with -m 'not memory')",
    "slow: long-running scale tests (deselect with -m 'not slow')",
    "live_apo: end-to-end APO training against a real LLM endpoint (select with -m live_apo)",
]
